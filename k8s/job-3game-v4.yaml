apiVersion: batch/v1
kind: Job
metadata:
  name: diplomacy-3game-v4
  namespace: ai-diplomacy
spec:
  backoffLimit: 3
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: game
          image: ghcr.io/froehlich99/ai_diplomacy:latest
          env:
            - name: EXPERIMENT_CONFIG
              value: "experiment_configs/k8s_3game_memory_v4.py"
            - name: EXPERIMENT_NAME
              value: "k8s_3game_memory_v4"
            - name: B2_BUCKET
              value: "diplomacy"
          envFrom:
            - secretRef:
                name: api-keys
            - secretRef:
                name: b2-credentials
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      restartPolicy: Never
